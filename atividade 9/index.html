<!DOCTYPE html>
<!-- Informa ao navegador que este documento usa HTML5 -->

<html lang="pt-br">
<!-- Início do documento HTML e define o idioma como português do Brasil -->

<head></head>
<!-- Cabeçalho do documento HTML -->

<meta charset="UTF-8">
<!-- Define a codificação dos caracteres, permitindo usar acentos corretamente -->

<title>Formulário</title>
<!-- Define o título que aparece na aba do navegador -->

</head>
<!-- Fecha a área head -->

<body>
<!-- Início do conteúdo que será mostrado na página -->

<h1>Formulário</h1>
<!-- Cria o título principal da página -->

<form>
<!-- Inicia o formulário -->

<fieldset>
<!-- Cria uma caixa para agrupar informações -->

<legend>Dados pessoais</legend>
<!-- Define o título da caixa de dados pessoais -->

Nome:
<!-- Texto indicando o campo para digitar o nome -->

<input type="text">
<!-- Cria uma caixa de texto para o usuário digitar o nome -->

<br><br>
<!-- Quebra duas linhas -->

Endereço:
<!-- Texto indicando o campo de endereço -->

<input type="text">
<!-- Cria uma caixa de texto para o endereço -->

<br><br>
<!-- Quebra duas linhas -->

Cidade:
<!-- Texto indicando o campo de cidade -->

<input type="text">
<!-- Cria uma caixa de texto para a cidade -->

<br><br>
<!-- Quebra duas linhas -->

Estado:
<!-- Texto indicando o campo de estado -->

<select>
<!-- Cria uma lista de opções -->

<option>São paulo</option>
<!-- Primeira opção da lista -->

<option>Rio de Janeiro</option>
<!-- Segunda opção da lista -->

<option>Minas Gerais</option>
<!-- Terceira opção da lista -->

<option>Piauí</option>
<!-- Quarta opção da lista -->

</select>
<!-- Fecha a lista de opções -->

</fieldset>
<!-- Fecha a caixa de dados pessoais -->

<br>
<!-- Quebra uma linha -->

<fieldset>
<!-- Cria outra caixa para agrupar informações -->

<legend>Dados profissionais</legend>
<!-- Define o título da caixa de dados profissionais -->

Natureza do Cargo
<!-- Texto indicando a escolha do cargo -->

<br>
<!-- Quebra uma linha -->

<input type="radio" name="cargo"> Gerência
<!-- Cria uma opção de seleção para Gerência -->

<input type="radio" name="cargo"> Financeiro
<!-- Cria uma opção de seleção para Financeiro -->

<input type="radio" name="cargo"> Recepção
<!-- Cria uma opção de seleção para Recepção -->

<input type="radio" name="cargo"> Administrativo
<!-- Cria uma opção de seleção para Administrativo -->

<input type="radio" name="cargo"> Jurídico
<!-- Cria uma opção de seleção para Jurídico -->

<br><br>
<!-- Quebra duas linhas -->

Área de interesse
<!-- Texto indicando as áreas de interesse -->

<br>
<!-- Quebra uma linha -->

<input type="checkbox"> Computação
<!-- Cria uma caixa de seleção para Computação -->

<input type="checkbox"> Biologia
<!-- Cria uma caixa de seleção para Biologia -->

<input type="checkbox"> Meio Ambiente
<!-- Cria uma caixa de seleção para Meio Ambiente -->

<input type="checkbox"> Engenharia
<!-- Cria uma caixa de seleção para Engenharia -->

<input type="checkbox"> História
<!-- Cria uma caixa de seleção para História -->

<br><br>
<!-- Quebra duas linhas -->

Mini-currículo:
<!-- Texto indicando o campo para escrever o mini-currículo -->

<br>
<!-- Quebra uma linha -->

<textarea rows="6" cols="40"></textarea>
<!-- Cria uma área grande para escrever o mini-currículo -->
<!-- rows define a quantidade de linhas e cols define a largura -->

</fieldset>
<!-- Fecha a caixa de dados profissionais -->

<br>
<!-- Quebra uma linha -->

<input type="submit" value="Enviar">
<!-- Cria o botão Enviar para enviar o formulário -->

<input type="reset" value="Limpar">
<!-- Cria o botão Limpar para apagar os dados preenchidos -->

</form>
<!-- Fecha o formulário -->

</body>
<!-- Fecha o conteúdo visível da página -->

</html>
<!-- Finaliza o documento HTML -->
